name: release

# Clean build of the installer from sources (spec 2.3 item 5 and 7.3): never from a developer's PC.
# The launcher uses the Modrinth App core (our fork, branch "nocturnum") as a path dependency:
# it is checked out next to this repository as ../nocturnum-core/code (CORE_REPO below).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CORE_REPO: Hikaru220/nocturnum-core   # the fork of modrinth/code with our changes (NOCTURNUM_CHANGES.md)
  CORE_REF: nocturnum
  SQLX_OFFLINE: "true"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nocturnum
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: nocturnum-core/code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependency audit (spec 7.3 item 4)
        working-directory: nocturnum
        run: |
          npm ci
          npm audit --audit-level=high
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
      - name: Build the mod jars
        working-directory: nocturnum/mod
        shell: bash
        run: ./gradlew buildAll --no-daemon -q && python ../mod/tools/collect_jars.py
      - name: Build the installer
        working-directory: nocturnum
        run: npm run tauri build
      - name: SHA-256 of every file (spec 7.3 item 8)
        working-directory: nocturnum
        shell: bash
        run: |
          mkdir -p release
          cp "src-tauri/target/release/bundle/nsis/"*setup.exe release/
          cd release && sha256sum * > SHA256.txt && cat SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nocturnum-installer
          path: nocturnum/release/*
      # Code signing (spec 7.3 item 7) is added here once the certificate exists:
      # sign the exe and the installer with signtool, then compare the VirusTotal reports of the signed and unsigned file.
