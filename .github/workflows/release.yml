name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build HUD mod jars and copy them into the launcher resources
        shell: bash
        working-directory: mod
        run: |
          ./gradlew buildAll --no-daemon
          python tools/collect_jars.py
      - name: Build installer
        run: npx tauri build
        env:
          # Code signing: set these repository secrets once you have a certificate (SmartScreen otherwise shows
          # "Unknown publisher"). Without them the installer is built unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: SHA-256 next to the installer
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
