[package]
name = "nocturnum-launcher"
version = "0.1.0"
description = "Nocturnum Launcher — open source game launcher with HUD client"
authors = ["Nocturnum contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nocturnum_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
discord-rich-presence = "0.2"
sysinfo = "0.33"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v3"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
once_cell = "1"
regex = "1"
md-5 = "0.10"
base64 = "0.22"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Storage_Streams"] }
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
