plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+26.3"
base { archivesName = 'nocturnum-hud' }

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc": "~26.3", "java": ">=25"
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
