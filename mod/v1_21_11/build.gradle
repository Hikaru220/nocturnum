plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${mod_version}+1.21.11"
base { archivesName = 'nocturnum-hud' }

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc": "~1.21.11", "java": ">=21"
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
